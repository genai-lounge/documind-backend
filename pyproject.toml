[project]
name = "documind-backend"
version = "0.1.0"
description = "DocuMind backend: FastAPI API for the RAG document assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.147.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
